<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>CatS Extension</title>
  <style>
    body { font-family: Arial; padding: 10px; width: 250px; }
    select, button { width: 100%; margin-top: 10px; }
  </style>
</head>

<body>
  <h3>Seleccionar Comunidad y Tag</h3>

  <label for="communitySelect">Comunidad:</label>
  <select id="communitySelect"></select>
  <p id="communityDescription" class="description"></p>
  
  <label for="tagSelect">Tag:</label>
  <select id="tagSelect"></select>
  <p id="tagDescription" class="description"></p>
  
  <button id="loadBtn">Subscribirse</button>

  <p id="statusMessage" style="margin-top: 10px; color: green;"></p>

  <script src="popup.js" defer></script>

  <hr>

  <h4>Herramientas de navegación</h4>
  <button id="subscriptionsBtn">Mis suscripciones</button>
  <button id="resetBtn" style="margin-top: 10px;">Resetear todo</button>

  <div id="subscriptionsList" style="margin-top: 10px; font-size: 14px; white-space: pre-wrap;"></div>

</body>

</html>
