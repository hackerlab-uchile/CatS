<!DOCTYPE html>
<html lang="es">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">

<head>
  <meta charset="UTF-8">
  <title>CatS Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h1>Seleccionar Comunidad y Tag</h1>

  <label for="communitySelect">Comunidad:</label>
  <select id="communitySelect"></select>
  <p id="communityDescription" class="description"></p>
  
  <label for="tagSelect">Tag:</label>
  <select id="tagSelect"></select>
  <p id="tagDescription" class="description"></p>
  
  <button id="loadBtn" style="background-color: #191D32; color: white;">Subscribirse</button>

  <p id="statusMessage" style="margin-top: 10px; color: green; font-size: 13px;"></p>

  <script src="popup.js" defer></script>

  <hr>

  <h4>Herramientas de navegación</h4>
  <button id="subscriptionsBtn" style="background-color: #282F44; color: white;">Mis suscripciones</button>
  <button id="resetBtn" style="background-color: #840032; color: white;">Resetear todo</button>

  <div id="subscriptionsList" style="margin-top: 10px; font-size: 17px; white-space: pre-wrap;"></div>

</body>

</html>
