<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>URLs del Tag</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      font-size: 14px;
      background-color: #f5f5f5;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    pre {
      background: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-x: auto;
      max-height: 400px;
      white-space: pre-wrap;
    }
    #closeBtn {
      display: block;
      margin: 20px auto 0 auto;
      width: 90%;
      padding: 10px;
      font-size: 14px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #closeBtn:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>
  <h2 id="title">URLs</h2>
  <pre id="urlList">Cargando...</pre>

  <button id="closeBtn">Cerrar</button>

  <script>
    document.getElementById('closeBtn').addEventListener('click', () => {
      window.close();
    });
  </script>
  <script src="urls_popup.js"></script>
</body>
</html>
