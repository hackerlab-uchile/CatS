services:
  db:
    image: postgres
    container_name: postgres_db
    restart: 'no'
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: CatS_user
      POSTGRES_PASSWORD: CatS_test
      POSTGRES_DB: CatS
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: CatS_app
    command: bash -c "python app/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on: 
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
  telegram_bot:
    build: 
      context: ./backend
      dockerfile: app/bot/Dockerfile
    container_name: CatS_bot
    env_file: .env
    depends_on:
      - db
      - backend
    volumes:
      - ./backend:/app
    command: python -u -m app.bot.bot_conn

volumes:
  db-data: