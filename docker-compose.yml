services:
  db:
    image: postgres
    container_name: postgres_db
    restart: 'no'
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: CatS_user
      POSTGRES_PASSWORD: CatS_test
      POSTGRES_DB: CatS
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: CatS_app
    command: python app/main.py backend
    depends_on: 
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
  telegram_bot:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: CatS_bot
    env_file: .env
    depends_on:
      - db
      - backend
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    command: python app/main.py bot

volumes:
  db-data: