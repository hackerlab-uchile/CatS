version: '3.9'
services:
  db:
    image: postgres
    restart: never
    ports:
      - 5432:5432
    environment:
      - PGUSER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_SERVER
    volumes:
      - db-data:/var/lib/postgresql/data
  frontend:
    build: ./frontend
    ports:
      - 3000:3000
  backend:
    build: ./backend

volumes:
  db-data: